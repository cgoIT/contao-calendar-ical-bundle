services:
    _defaults:
        autoconfigure: true
        autowire: true
        public: false
        bind:
            $projectDir: '%kernel.project_dir%'
            $csrfTokenManager: '@contao.csrf.token_manager'
            $csrfTokenName: '%contao.csrf_token_name%'
            $defaultEndTimeDifference: '%calendar_ical.end_date_time_difference_in_days%'

    Cgoit\ContaoCalendarIcalBundle\:
        resource: ../src/*
        exclude: '../src/{ContaoManager,DependencyInjection,Event,Widgets}'

    Cgoit\ContaoCalendarIcalBundle\Backend\ImportFileController:
        public: true

    Cgoit\ContaoCalendarIcalBundle\Backend\Automator:
        public: true

    Cgoit\ContaoCalendarIcalBundle\Controller\Route\EventlistIcsExportController:
        public: true

    Cgoit\ContaoCalendarIcalBundle\Controller\Route\SingleEventIcsExportController:
        public: true
